<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>协会会费账务</title><style>
:root{--g:#176b50;--ink:#193027;--mute:#66766e;--line:#dce5df;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 20px}.top,.head,.filters,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top,.head{justify-content:space-between}.brand{font-size:20px;font-weight:700}.muted{color:var(--mute);font-size:13px}.card,.panel,.dialog{background:#fff;border:1px solid var(--line);border-radius:14px}.card{padding:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card b{display:block;font-size:25px;margin-top:4px}.balance{background:var(--g);color:#fff}.balance .muted{color:#d7ebe0}.panel{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute)}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;background:var(--g);color:white}button.subtle{background:#edf3ef;color:#275943}button.link{background:transparent;color:var(--g);padding:2px;text-align:left}input,select,textarea{border:1px solid #cfdad4;border-radius:8px;padding:8px;background:white}textarea{width:100%;min-height:82px;resize:vertical}.login{max-width:400px;margin:10vh auto;padding:24px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:13px;color:var(--mute)}.modal{position:fixed;inset:0;background:#10201888;display:none;align-items:center;justify-content:center;padding:14px;z-index:5}.modal.show{display:flex}.dialog{width:min(760px,100%);max-height:94vh;overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.preview{max-height:72vh;overflow:auto;background:#edf1ee;border-radius:8px;padding:8px;text-align:center}.preview img{max-width:100%;max-height:68vh;object-fit:contain;cursor:zoom-in}.preview img.zoom{max-width:none;max-height:none;cursor:zoom-out}.pdf-page{display:block;height:auto;margin:0 auto 12px;background:white;box-shadow:0 1px 6px #0003}.viewer-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}.viewer-bar button{padding:6px 10px;font-size:13px}.viewer-bar .sep{flex:1}#pageInfo,#zoomInfo{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}.history{border-top:1px solid var(--line);padding:10px 0}.old{color:#aa413d;text-decoration:line-through}.new{color:var(--g)}.badge{display:inline-block;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:var(--g);color:#fff;white-space:nowrap}.badge.update{background:#b7791f}.badge.delete{background:#aa413d}.audit-list{max-height:58vh;overflow:auto;margin:10px 0}.audit-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fbfdfb}.audit-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.audit-head b{font-size:15px}.audit-meta{font-size:12px;color:var(--mute);margin:6px 0}.audit-item .diff{font-size:13px;line-height:1.7;word-break:break-word}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#20382d;color:#fff;border-radius:8px;z-index:8}@media(max-width:640px){.wrap{padding:16px 10px}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.dialog{padding:15px}.preview{max-height:76vh}}
</style></head><body><div id="app"></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script src="/app.js"></script></body></html>
